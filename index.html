<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GroupFlow - tasks, deadlines, chat and progress for student project teams." />
    <title>GroupFlow</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="topbar">
      <a class="brand" href="#/dashboard">GroupFlow</a>
      <span class="group-name" id="group-name"></span>
      <span class="user-name" id="user-name" hidden></span>
      <a class="avatar" id="current-user" href="#/members" title="Your profile" hidden></a>
      <button type="button" class="btn-secondary logout-btn" id="logout-btn" hidden>Log out</button>
    </header>

    <div class="layout">
      <nav class="sidebar" aria-label="Main">
        <a href="#/dashboard" data-route="dashboard">Dashboard</a>
        <a href="#/tasks" data-route="tasks">Task Board</a>
        <a href="#/calendar" data-route="calendar">Calendar</a>
        <a href="#/chat" data-route="chat">Group Chat <span class="badge" id="chat-badge" hidden></span></a>
        <a href="#/progress" data-route="progress">Progress</a>
        <a href="#/members" data-route="members">Members</a>
        <a href="#/groups" data-route="groups">Groups</a>
        <a href="#/invite" data-route="invite">Invite</a>
      </nav>

      <main id="main" tabindex="-1"></main>
    </div>

    <nav class="tabbar" aria-label="Main (mobile)">
      <a href="#/dashboard" data-route="dashboard">Home</a>
      <a href="#/tasks" data-route="tasks">Tasks</a>
      <a href="#/calendar" data-route="calendar">Calendar</a>
      <a href="#/chat" data-route="chat">Chat</a>
      <a href="#/progress" data-route="progress">Progress</a>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <dialog id="task-dialog" aria-labelledby="task-dialog-title">
      <form id="task-form" method="dialog" novalidate>
        <h2 id="task-dialog-title">New task</h2>
        <label>Task name
          <input name="title" maxlength="100" required />
        </label>
        <p class="field-error" data-error="title"></p>
        <label>Description
          <textarea name="description" rows="3"></textarea>
        </label>
        <div class="field-row">
          <label>Assigned to
            <select name="assignee" id="assignee-select"></select>
          </label>
          <label>Due date
            <input name="dueDate" type="date" required />
          </label>
        </div>
        <p class="field-error" data-error="dueDate"></p>
        <div class="field-row">
          <label>Status
            <select name="status">
              <option value="todo">To Do</option>
              <option value="progress">In Progress</option>
              <option value="done">Done</option>
            </select>
          </label>
          <label>Priority
            <select name="priority">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </label>
        </div>
        <div class="subtasks-block">
          <h3>Subtasks</h3>
          <p class="field-error" data-error="subtasks"></p>
          <div id="subtask-list"></div>
          <button type="button" class="btn-secondary" id="add-subtask">+ Add subtask</button>
        </div>
        <p class="form-error" id="task-form-error" role="alert"></p>
        <div class="dialog-actions">
          <button type="button" class="btn-danger" id="delete-task">Delete task</button>
          <span class="spacer"></span>
          <button type="button" class="btn-secondary" data-close>Cancel</button>
          <button type="submit" class="btn-primary">Save changes</button>
        </div>
      </form>
    </dialog>

    <dialog id="event-dialog" aria-labelledby="event-dialog-title">
      <form id="event-form" method="dialog" novalidate>
        <h2 id="event-dialog-title">Add meeting</h2>
        <label>Title
          <input name="title" maxlength="80" required />
        </label>
        <p class="field-error" data-error="title"></p>
        <label>Date
          <input name="date" type="date" required />
        </label>
        <p class="field-error" data-error="date"></p>
        <div class="field-row">
          <label>Start time (optional)
            <input name="startTime" type="time" />
          </label>
          <label>Time zone
            <input name="timeZone" maxlength="64" placeholder="America/Chicago" />
          </label>
        </div>
        <p class="field-error" data-error="startTime"></p>
        <p class="field-error" data-error="timeZone"></p>
        <p class="muted">Timed meetings show the stored time zone. Leave time empty for a date-only meeting.</p>
        <label>Notes
          <textarea name="description" rows="2" maxlength="1000"></textarea>
        </label>
        <p class="field-error" data-error="description"></p>
        <p class="form-error" id="event-form-error" role="alert"></p>
        <div class="dialog-actions">
          <button type="button" class="btn-danger" id="delete-event" hidden>Delete meeting</button>
          <span class="spacer"></span>
          <button type="button" class="btn-secondary" data-close>Cancel</button>
          <button type="submit" class="btn-primary">Save meeting</button>
        </div>
      </form>
    </dialog>

    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>

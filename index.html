<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GroupFlow - tasks, deadlines, chat and progress for student project teams." />
    <title>GroupFlow</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="topbar">
      <a class="brand" href="#/dashboard">GroupFlow</a>
      <span class="group-name" id="group-name"></span>
      <a class="avatar" id="current-user" href="#/members" title="Your profile"></a>
    </header>

    <div class="layout">
      <nav class="sidebar" aria-label="Main">
        <a href="#/dashboard" data-route="dashboard">Dashboard</a>
        <a href="#/tasks" data-route="tasks">Task Board</a>
        <a href="#/calendar" data-route="calendar">Calendar</a>
        <a href="#/chat" data-route="chat">Group Chat <span class="badge" id="chat-badge" hidden></span></a>
        <a href="#/progress" data-route="progress">Progress</a>
        <a href="#/members" data-route="members">Members</a>
      </nav>

      <main id="main" tabindex="-1"></main>
    </div>

    <nav class="tabbar" aria-label="Main (mobile)">
      <a href="#/dashboard" data-route="dashboard">Home</a>
      <a href="#/tasks" data-route="tasks">Tasks</a>
      <a href="#/calendar" data-route="calendar">Calendar</a>
      <a href="#/chat" data-route="chat">Chat</a>
      <a href="#/progress" data-route="progress">Progress</a>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <dialog id="task-dialog" aria-labelledby="task-dialog-title">
      <form id="task-form" method="dialog" novalidate>
        <h2 id="task-dialog-title">New task</h2>
        <label>Task name
          <input name="title" maxlength="100" required />
        </label>
        <p class="field-error" data-error="title"></p>
        <label>Description
          <textarea name="description" rows="3"></textarea>
        </label>
        <div class="field-row">
          <label>Assigned to
            <select name="assignee" id="assignee-select"></select>
          </label>
          <label>Due date
            <input name="dueDate" type="date" required />
          </label>
        </div>
        <p class="field-error" data-error="dueDate"></p>
        <div class="field-row">
          <label>Status
            <select name="status">
              <option value="todo">To Do</option>
              <option value="progress">In Progress</option>
              <option value="done">Done</option>
            </select>
          </label>
          <label>Priority
            <select name="priority">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </label>
        </div>
        <div class="dialog-actions">
          <button type="button" class="btn-danger" id="delete-task">Delete task</button>
          <span class="spacer"></span>
          <button type="button" class="btn-secondary" data-close>Cancel</button>
          <button type="submit" class="btn-primary">Save changes</button>
        </div>
      </form>
    </dialog>

    <dialog id="event-dialog" aria-labelledby="event-dialog-title">
      <form id="event-form" method="dialog" novalidate>
        <h2 id="event-dialog-title">Add event</h2>
        <label>Title
          <input name="title" maxlength="80" required />
        </label>
        <label>Date
          <input name="date" type="date" required />
        </label>
        <label>Notes
          <textarea name="description" rows="2"></textarea>
        </label>
        <p class="field-error" data-error="event"></p>
        <div class="dialog-actions">
          <span class="spacer"></span>
          <button type="button" class="btn-secondary" data-close>Cancel</button>
          <button type="submit" class="btn-primary">Add event</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
